<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0907">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=JetBrains+Mono:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/app.css">
  <title>Pago simulado</title>
</head>
<body>
  <main class="center-page"><div class="status-card card" id="card">
    <span class="pill" style="margin-bottom:20px">Modo demostración</span>
    <h1 class="display h-md" style="margin-bottom:10px">Simulador de pago</h1>
    <p class="muted" style="margin-top:0">Esta pantalla reemplaza a Mercado Pago mientras no configures tus credenciales (<code>MP_ACCESS_TOKEN</code>). Úsala para probar el flujo completo.</p>
    <div class="summary" id="sum" style="text-align:left"></div>
    <div style="display:grid;gap:10px">
      <button class="btn btn-gold btn-lg btn-block" data-result="approved">Aprobar pago</button>
      <button class="btn btn-block" data-result="rejected">Rechazar pago</button>
    </div>
  </div></main>
  <script src="/assets/common.js"></script>
  <script src="/assets/demo.js"></script>
</body>
</html>
